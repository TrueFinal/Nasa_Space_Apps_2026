<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZEPHYR — Tendências Climáticas | 3D Earth Globe</title>
  
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://unpkg.com/globe.gl@2.32.1/dist/globe.gl.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #030508;
      font-family: 'Inter', sans-serif;
      color: #f8fafc;
    }

    
    .space-backdrop {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, #0d2238 0%, #06101c 34%, #030508 68%, #020305 100%);
      z-index: 0;
      pointer-events: none;
    }

    
    .atmosphere-aura {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 68vmin;
      height: 68vmin;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(195, 235, 255, 0.42) 0%,
        rgba(110, 195, 255, 0.28) 38%,
        rgba(56, 145, 235, 0.14) 56%,
        rgba(20, 75, 140, 0.04) 68%,
        transparent 76%
      );
      filter: blur(26px);
      z-index: 1;
      pointer-events: none;
    }

    #globeViz {
      position: fixed;
      inset: 0;
      z-index: 2;
      cursor: grab;
    }

    #globeViz:active {
      cursor: grabbing;
    }

    
    .scene-tooltip {
      font-family: 'JetBrains Mono', monospace !important;
      background: rgba(5, 10, 18, 0.92) !important;
      border: 1px solid rgba(216, 240, 255, 0.45) !important;
      border-radius: 4px !important;
      padding: 6px 10px !important;
      color: #f0f9ff !important;
      font-size: 11px !important;
      box-shadow: 0 0 18px rgba(191, 230, 255, 0.25) !important;
      backdrop-filter: blur(6px);
    }

    
    .logo-glass-dark {
      background: transparent;
    }

    .logo-badge-white {
      background: rgba(255, 255, 255, 0.96);
      padding: 14px 18px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.75);
    }
  </style>
</head>
<body>

  
  <div class="space-backdrop"></div>
  <div id="auraGlow" class="atmosphere-aura"></div>

  
  <div id="globeViz"></div>

  
  
  
  <div class="fixed top-7 left-7 z-20 group">
    <div id="logoWrapper" class="logo-glass-dark transition-all duration-300 relative">
      
      
      <div class="absolute -bottom-7 left-0 flex items-center gap-1.5 opacity-0 group-hover:opacity-100 transition-opacity duration-200">
        <button onclick="toggleLogoStyle()" class="text-[10px] px-2 py-0.5 rounded bg-white/10 hover:bg-white/20 text-slate-300 backdrop-blur border border-white/15">
          ◐ Fundo
        </button>
        <label class="cursor-pointer text-[10px] px-2 py-0.5 rounded bg-white/10 hover:bg-white/20 text-slate-300 backdrop-blur border border-white/15">
          ↑ Sua Logo
          <input type="file" accept="image/*" class="hidden" onchange="uploadLogoFile(event)" />
    <button onclick="toggleMarkers()" id="btnMarkers" title="Mostrar/Ocultar Pontos Táticos"
            class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 border border-sky-100/25 flex items-center justify-center text-xs text-orange-400 backdrop-blur">
      ●
    </button>
    <button onclick="toggleCloudsAndGrid()" id="btnClouds" title="Mostrar/Ocultar Nuvens e Grade"
            class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 border border-sky-100/25 flex items-center justify-center text-xs text-sky-200 backdrop-blur">
      ☁
    </button>
    <button onclick="focusGoiania()" title="Centralizar em Goiás / Cerrado"
            class="px-2.5 h-8 rounded-full bg-white/10 hover:bg-white/20 border border-sky-100/25 flex items-center justify-center text-[10px] tracking-wider text-sky-100 backdrop-blur">
      GOIÁS
    </button>
  </div>

  
  
  
  <script>
    let globe = null;
    let cloudsMesh = null;
    let fresnelRimMesh = null;
    let isRotating = true;
    let showMarkers = true;
    let showCloudsAndGrid = true;
    let logoWhiteCard = false;

    let tacticalPoints = [];
    let tacticalRings = [];

    function generateCleanBasePoints() {
      return [
        { lat: -16.6869, lng: -49.2648, color: '#34d399', size: 0.52, label: 'GOIÂNIA — CERRADO CORE (τ = +0.74, p < 0.001)', pulse: true },
        { lat: -14.1311, lng: -47.5236, color: '#facc15', size: 0.44, label: 'CHAPADA DOS VEADEIROS — MODIS NDVI', pulse: true },
        { lat: -13.8500, lng: -50.6000, color: '#ff5722', size: 0.44, label: 'BACIA DO ARAGUAIA — GLDAS HYDROLOGY' },
        { lat: -17.7311, lng: -49.1078, color: '#facc15', size: 0.40, label: 'BACIA DO RIO MEIA PONTE — MANN-KENDALL' },
        { lat: -15.7975, lng: -47.8919, color: '#38bdf8', size: 0.42, label: 'BRASÍLIA — ESTAÇÃO CENTRAL' },

        { lat: -3.1190,  lng: -60.0217, color: '#facc15', size: 0.48, label: 'MANAUS — BACIA AMAZÔNICA', pulse: true },
        { lat: -23.5505, lng: -46.6333, color: '#ff5722', size: 0.44, label: 'SÃO PAULO — METRÓPOLE' },
        { lat: -12.9714, lng: -38.5014, color: '#facc15', size: 0.42, label: 'ATLÂNTICO SUL / SALVADOR' },
        { lat: 10.5000,  lng: -38.0700, color: '#facc15', size: 0.50, label: 'OCEANO ATLÂNTICO — CORRENTE EQUATORIAL', pulse: true },
        { lat: 19.4326,  lng: -99.1332, color: '#ff5722', size: 0.44, label: 'GOLFO / AMÉRICA CENTRAL' },
        { lat: 25.7617,  lng: -80.1918, color: '#facc15', size: 0.44, label: 'FLÓRIDA — MONITORAMENTO COSTEIRO' },
        { lat: 36.7783,  lng: -119.4179, color: '#ff5722', size: 0.48, label: 'CALIFÓRNIA — SENSOR TERMAL MODIS', pulse: true },
        { lat: 40.7128,  lng: -74.0060, color: '#38bdf8', size: 0.42, label: 'ATLÂNTICO NORTE / NOVA YORK' },
        { lat: 14.5995,  lng: -24.0000, color: '#ef4444', size: 0.50, label: 'CABO VERDE — ANOMALIA ATMOSFÉRICA', pulse: true }
      ];
    }

    function setupReferenceAtmosphereAndClouds() {
      const scene = globe.scene();
      const globeRadius = globe.getGlobeRadius();

      const fresnelVertexShader = `
        varying vec3 vNormal;
        varying vec3 vPositionNormal;
        void main() {
          vNormal = normalize(normalMatrix * normal);
          vPositionNormal = normalize((modelViewMatrix * vec4(position, 1.0)).xyz);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `;

      const fresnelFragmentShader = `
        varying vec3 vNormal;
        varying vec3 vPositionNormal;
        void main() {
          float viewDot = dot(vNormal, vPositionNormal);
          float rim = pow(clamp(1.0 + viewDot, 0.0, 1.0), 2.65);
          vec3 innerBlue = vec3(0.38, 0.76, 1.0);
          vec3 outerIcyWhite = vec3(0.88, 0.96, 1.0);
          vec3 finalColor = mix(innerBlue, outerIcyWhite, pow(rim, 1.4));
          gl_FragColor = vec4(finalColor, rim * 0.68);
        }
      `;

      const fresnelGeom = new THREE.SphereGeometry(globeRadius * 1.016, 64, 64);
      const fresnelMat = new THREE.ShaderMaterial({
        vertexShader: fresnelVertexShader,
        fragmentShader: fresnelFragmentShader,
        blending: THREE.AdditiveBlending,
        side: THREE.FrontSide,
        transparent: true,
        depthWrite: false
      });

      fresnelRimMesh = new THREE.Mesh(fresnelGeom, fresnelMat);
      scene.add(fresnelRimMesh);

      new THREE.TextureLoader().load(
        'https://unpkg.com/three-globe/example/img/earth-clouds.png',
        cloudsTexture => {
          const cloudsGeom = new THREE.SphereGeometry(globeRadius * 1.009, 64, 64);
          const cloudsMat = new THREE.MeshPhongMaterial({
            map: cloudsTexture,
            transparent: true,
            opacity: 0.42,
            blending: THREE.AdditiveBlending,
            depthWrite: false
          });
          cloudsMesh = new THREE.Mesh(cloudsGeom, cloudsMat);
          scene.add(cloudsMesh);

          (function rotateClouds() {
            if (cloudsMesh && showCloudsAndGrid) {
              cloudsMesh.rotation.y += 0.00035;
            }
            requestAnimationFrame(rotateClouds);
          })();
        }
      );

      scene.children.forEach(obj => {
        if (obj.isAmbientLight) {
          obj.intensity = 1.15;
        }
        if (obj.isDirectionalLight) {
          obj.intensity = 1.35;
          obj.color = new THREE.Color('#e8f6ff');
        }
      });
    }

    function initSentinelGlobe() {
      const container = document.getElementById('globeViz');

      tacticalPoints = generateCleanBasePoints();
      tacticalRings = tacticalPoints.filter(p => p.pulse);

      globe = Globe()(container)
        .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
        .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
        .backgroundColor('rgba(0,0,0,0)')
        .showAtmosphere(true)
        .atmosphereColor('#7cc8ff')
        .atmosphereAltitude(0.22)
        .showGraticules(true)
        .pointsData(tacticalPoints)
        .pointLat('lat')
        .pointLng('lng')
        .pointColor('color')
        .pointAltitude(0.012)
        .pointRadius('size')
        .pointLabel(d => `
          <div>
            <div style="color:#d8f0ff;font-weight:600;">${d.label}</div>
            <div style="color:#94a3b8;font-size:10px;">LAT ${d.lat.toFixed(2)}° • LNG ${d.lng.toFixed(2)}°</div>
          </div>
        `)
        .ringsData(tacticalRings)
        .ringLat('lat')
        .ringLng('lng')
        .ringColor(d => t => {
          if (d.color === '#34d399') return `rgba(52, 211, 153, ${Math.max(0, 0.85 - t)})`;
          if (d.color === '#facc15') return `rgba(250, 204, 21, ${Math.max(0, 0.85 - t)})`;
          return `rgba(255, 87, 34, ${Math.max(0, 0.85 - t)})`;
        })
        .ringMaxRadius(3.4)
        .ringPropagationSpeed(1.4)
        .ringRepeatPeriod(1400);

      const globeMaterial = globe.globeMaterial();
      globeMaterial.bumpScale = 5;
      new THREE.TextureLoader().load('https://unpkg.com/three-globe/example/img/earth-water.png', texture => {
        globeMaterial.specularMap = texture;
        globeMaterial.specular = new THREE.Color('#3b82f6');
        globeMaterial.shininess = 22;
      });

      setupReferenceAtmosphereAndClouds();

      setTimeout(() => {
        globe.scene().traverse(obj => {
          if (obj.isLineSegments && obj.material) {
            obj.material.color = new THREE.Color('#ccebff');
            obj.material.transparent = true;
            obj.material.opacity = 0.06;
          }
        });
      }, 400);

      const controls = globe.controls();
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.35;
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.minDistance = 145;
      controls.maxDistance = 460;

      globe.pointOfView({ lat: 4.0, lng: -52.0, altitude: 2.1 }, 0);

      window.addEventListener('resize', () => {
        globe.width(window.innerWidth);
        globe.height(window.innerHeight);
      });

      fetchLiveTacticalFeeds();
    }

    async function fetchLiveTacticalFeeds() {
      try {
        const usgsRes = await fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_day.geojson');
        if (usgsRes.ok) {
          const usgsData = await usgsRes.json();
          const quakes = (usgsData.features || []).slice(0, 12).map(f => {
            const [lng, lat] = f.geometry.coordinates;
            const mag = f.properties.mag || 4.5;
            return {
              lat: Number(lat),
              lng: Number(lng),
              size: Math.min(0.52, 0.28 + mag * 0.04),
              color: mag >= 5.5 ? '#ef4444' : '#facc15',
              label: `USGS SÍSMICO M${mag.toFixed(1)} • ${f.properties.place || 'Global'}`,
              pulse: mag >= 5.3
            };
          });
          tacticalPoints = [...tacticalPoints, ...quakes];
          tacticalRings = tacticalPoints.filter(p => p.pulse);
          if (showMarkers && globe) {
            globe.pointsData(tacticalPoints);
            globe.ringsData(tacticalRings);
          }
        }
      } catch (_) {}

      try {
        const eonetRes = await fetch('https://eonet.gsfc.nasa.gov/api/v3/events?status=open&limit=10');
        if (eonetRes.ok) {
          const eonetData = await eonetRes.json();
          const events = [];
          (eonetData.events || []).forEach(ev => {
            const geom = ev.geometry && ev.geometry[ev.geometry.length - 1];
            if (geom && geom.coordinates && geom.coordinates.length >= 2) {
              events.push({
                lat: Number(geom.coordinates[1]),
                lng: Number(geom.coordinates[0]),
                size: 0.45,
                color: '#ff5722',
                label: `NASA EONET • ${ev.title}`,
                pulse: true
              });
            }
          });
          tacticalPoints = [...tacticalPoints, ...events];
          tacticalRings = tacticalPoints.filter(p => p.pulse);
          if (showMarkers && globe) {
            globe.pointsData(tacticalPoints);
            globe.ringsData(tacticalRings);
          }
        }
      } catch (_) {}
    }

    function toggleRotation() {
      isRotating = !isRotating;
      if (globe) globe.controls().autoRotate = isRotating;
      document.getElementById('btnRotate').classList.toggle('opacity-40', !isRotating);
    }

    function toggleMarkers() {
      showMarkers = !showMarkers;
      if (!globe) return;
      globe.pointsData(showMarkers ? tacticalPoints : []);
      globe.ringsData(showMarkers ? tacticalRings : []);
      document.getElementById('btnMarkers').classList.toggle('opacity-40', !showMarkers);
    }

    function toggleCloudsAndGrid() {
      showCloudsAndGrid = !showCloudsAndGrid;
      if (!globe) return;
      globe.showGraticules(showCloudsAndGrid);
      if (cloudsMesh) cloudsMesh.visible = showCloudsAndGrid;
      document.getElementById('btnClouds').classList.toggle('opacity-40', !showCloudsAndGrid);
    }

    function focusGoiania() {
      if (globe) {
        globe.pointOfView({ lat: -16.6869, lng: -49.2648, altitude: 1.55 }, 1300);
      }
    }

    function toggleLogoStyle() {
      logoWhiteCard = !logoWhiteCard;
      const wrapper = document.getElementById('logoWrapper');
      const mainFills = document.querySelectorAll('.zp-fill-main');
      const mainStrokes = document.querySelectorAll('.zp-stroke-main');
      const gridLines = document.querySelectorAll('.zp-grid-line');
      const globeFill = document.querySelector('.zp-globe-fill');

      if (logoWhiteCard) {
        wrapper.className = 'logo-badge-white transition-all duration-300 relative';
        mainFills.forEach(el => el.setAttribute('fill', '#102a4c'));
        mainStrokes.forEach(el => el.setAttribute('stroke', '#102a4c'));
        gridLines.forEach(el => el.setAttribute('stroke', '#ffffff'));
        if (globeFill) globeFill.setAttribute('fill', '#f8fafc');
      } else {
        wrapper.className = 'logo-glass-dark transition-all duration-300 relative';
        mainFills.forEach(el => el.setAttribute('fill', '#f8fafc'));
        mainStrokes.forEach(el => el.setAttribute('stroke', '#e2e8f0'));
        gridLines.forEach(el => el.setAttribute('stroke', '#0f172a'));
        if (globeFill) globeFill.setAttribute('fill', 'rgba(15, 23, 42, 0.55)');
      }
    }

    function uploadLogoFile(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = document.getElementById('uploadedLogoImg');
        const svg = document.getElementById('zephyrVectorLogo');
        img.src = e.target.result;
        img.classList.remove('hidden');
        svg.classList.add('hidden');
      };
      reader.readAsDataURL(file);
    }

    window.onload = function () {
      initSentinelGlobe();
    };
  </script>
</body>
</html>
