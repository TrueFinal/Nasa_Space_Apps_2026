[project]
name = "spherex-tracking"
version = "0.1.0"
description = "Experimental shift-and-stack for faint moving sources"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "astropy>=6,<9",
  "matplotlib>=3.8,<4",
  "sep>=1.4.1",
  "astroquery>=0.4.11",
]

[project.optional-dependencies]
infrared = ["truststore>=0.10; sys_platform == 'win32'"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]
literature = [
    "find-asteroids>=0.1.3",
]
ml = [
    "scikit-learn>=1.9.1",
    "xgboost-cpu>=3.2.0",
]
viz = [
    "ipyaladin>=0.8.1",
    "photutils>=3.0.0",
    "reproject>=0.21.0",
]

[project.scripts]
zephyr-infrared = "spherex_tracking.infrared:main"
spherex-tracking = "spherex_tracking.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
